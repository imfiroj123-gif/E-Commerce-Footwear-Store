<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIVO | Product Details</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .product-detail { padding: 120px 60px 80px; display: flex; gap: 60px; align-items: flex-start; }
        .product-gallery { flex: 1; position: sticky; top: 100px; }
        .main-image-wrap {
            border-radius: 20px;
            overflow: hidden;
            background: var(--surface);
            aspect-ratio: 1;
            margin-bottom: 14px;
            cursor: zoom-in;
        }
        .main-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .main-image-wrap:hover .main-image { transform: scale(1.05); }
        .thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
        .thumb {
            width: 72px; height: 72px; border-radius: 10px; overflow: hidden;
            border: 2px solid transparent; cursor: pointer; transition: border-color var(--transition-fast);
            background: var(--surface);
        }
        .thumb.active { border-color: var(--accent); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        .product-info { flex: 1; }
        .product-category-tag {
            font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--gold); margin-bottom: 16px; display: block;
        }
        .product-detail-name {
            font-family: var(--font-display); font-size: clamp(28px, 3vw, 44px);
            font-weight: 700; line-height: 1.1; margin-bottom: 16px;
        }
        .product-detail-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .product-detail-stars { color: var(--gold); font-size: 18px; }
        .review-count { color: var(--text-muted); font-size: 14px; }
        .product-detail-price { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
        .product-current-price { font-size: 36px; font-weight: 800; }
        .product-original-price { font-size: 20px; color: var(--text-faint); text-decoration: line-through; }
        .discount-tag { background: var(--accent-glow); color: var(--accent); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(232,50,90,0.3); }
        .product-detail-desc { color: var(--text-muted); font-size: 16px; line-height: 1.8; margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }

        .size-section { margin-bottom: 28px; }
        .size-label { font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
        .size-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .size-btn {
            padding: 10px 18px; border-radius: 10px; border: 1.5px solid var(--border);
            background: transparent; color: var(--text-secondary); font-size: 14px;
            font-family: var(--font-main); cursor: pointer; transition: all var(--transition-fast);
            font-weight: 500;
        }
        .size-btn:hover { border-color: var(--accent-light); color: var(--text-primary); }
        .size-btn.active { border-color: var(--accent); background: var(--accent); color: white; }
        .size-btn.out-of-stock { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

        .qty-section { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
        .qty-controls { display: flex; align-items: center; gap: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 30px; overflow: hidden; }
        .qty-controls .qty-btn { width: 44px; height: 44px; border: none; background: transparent; color: var(--text-primary); font-size: 22px; cursor: pointer; transition: background var(--transition-fast); }
        .qty-controls .qty-btn:hover { background: var(--surface-hover); }
        .qty-controls .qty-value { width: 48px; text-align: center; font-size: 16px; font-weight: 700; }

        .product-actions { display: flex; gap: 12px; }
        .btn-add-full { flex: 1; padding: 18px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-wishlist { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--border-active); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: all var(--transition-smooth); color: var(--text-secondary); }
        .btn-wishlist:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

        .product-meta { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .meta-row { display: flex; gap: 12px; font-size: 14px; }
        .meta-label { color: var(--text-muted); min-width: 80px; }
        .meta-value { color: var(--text-secondary); }

        .tabs { margin-top: 60px; }
        .tab-btns { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
        .tab-btn { padding: 14px 24px; background: none; border: none; color: var(--text-muted); font-size: 15px; font-family: var(--font-main); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all var(--transition-fast); font-weight: 500; }
        .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .related-section { padding: 60px; background: var(--bg-secondary); }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin-top: 32px; }

        @media (max-width: 900px) {
            .product-detail { flex-direction: column; padding: 120px 24px 60px; gap: 32px; }
            .product-gallery { position: static; }
            .related-section { padding: 40px 24px; }
        }
        @media(max-width:600px){
            .product-detail{padding:104px 16px 48px;gap:24px;}
            .main-image-wrap{border-radius:14px;}
            .thumb{width:58px;height:58px;}
            .product-detail-name{font-size:clamp(28px,9vw,38px);}
            .product-detail-rating{gap:8px;flex-wrap:wrap;}
            .product-detail-stars{font-size:16px;}
            .product-detail-price{gap:8px;flex-wrap:wrap;}
            .product-current-price{font-size:30px;}
            .product-original-price{font-size:17px;}
            .product-detail-desc{font-size:15px;padding-bottom:24px;margin-bottom:24px;}
            .qty-section{gap:14px;}
            .product-actions .btn-add-full{padding:15px 10px;font-size:14px;}
            .btn-wishlist{width:50px;height:50px;flex-shrink:0;}
            .tabs{margin-top:42px;}
            .tab-btns{overflow-x:auto;}
            .tab-btn{padding:12px 14px;font-size:14px;white-space:nowrap;}
            .related-section{padding:36px 16px;}
            .related-grid{grid-template-columns:1fr;gap:16px;}
        }
    </style>
</head>
<body>
<header class="navbar" id="navbar">
    <a href="../index.html" class="nav-logo" aria-label="ZIVO home"><span class="nav-logo-text">ZIVO</span><img class="nav-logo-image" src="../images/zivo-logo.svg?v=2" alt="ZIVO logo"></a>
    <nav><ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul></nav>
    <div class="nav-actions">
        <button class="nav-icon-btn" id="search-btn"><i class="fas fa-search"></i></button>
        <button class="nav-icon-btn" id="cart-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cart-count">0</span></button>
        <button class="nav-icon-btn" onclick="handleUserClick()"><i class="fas fa-user"></i></button>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
</header>
<nav class="mobile-nav" id="mobile-nav">
    <a href="../index.html">Home</a>
    <a href="shop.html">Shop</a>
</nav>
<div class="search-overlay" id="search-overlay">
    <div class="search-overlay-inner">
        <button class="search-close" id="search-close">×</button>
        <input type="text" id="search-input" placeholder="Search products...">
    </div>
</div>

<div id="product-container">
    <div style="height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="spinner"></div>
    </div>
</div>

<!-- CART SIDEBAR -->
<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header"><h2 class="cart-title">Your Cart</h2><button class="cart-close" id="cart-close">×</button></div>
    <div class="cart-empty" id="cart-empty" style="display:flex;"><div class="cart-empty-icon">🛒</div><p>Empty cart</p></div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer" style="display:none;">
        <div class="cart-subtotal"><span>Subtotal</span><span id="cart-subtotal-val">$0</span></div>
        <div class="cart-subtotal"><span>Shipping</span><span id="cart-shipping-val">$0</span></div>
        <div class="cart-total"><span>Total</span><span class="cart-total-amount" id="cart-total-val">$0</span></div>
        <a href="checkout.html" class="btn-primary" style="width:100%;justify-content:center;text-decoration:none;">Checkout</a>
    </div>
</aside>

<script src="../js/utils.js"></script>
<script src="../js/cart.js"></script>
<script>
let currentProduct = null;
let selectedSize = '';
let qty = 1;

async function loadProduct() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { window.location.href = 'shop.html'; return; }

    try {
        const product = await fetch(`${API_BASE}/products/${id}`).then(r => r.json());
        currentProduct = product;
        document.title = `ZIVO | ${product.name}`;
        renderProduct(product);
        loadRelated(product.category, product._id);
    } catch(e) {
        document.getElementById('product-container').innerHTML = `<div style="text-align:center;padding:120px 40px;"><p style="color:var(--text-muted)">Failed to load product. <a href="shop.html" style="color:var(--accent)">Back to Shop</a></p></div>`;
    }
}

function renderProduct(p) {
    const discount = p.originalPrice > p.price ? Math.round(100 - (p.price / p.originalPrice * 100)) : 0;
    const allImages = [p.image, ...(p.images || [])].map(normalizeImageUrl).filter((v, i, a) => a.indexOf(v) === i);

    document.getElementById('product-container').innerHTML = `
    <div class="product-detail">
        <div class="product-gallery">
            <div class="main-image-wrap">
                <img src="${normalizeImageUrl(p.image)}" alt="${p.name}" class="main-image" id="main-img" onerror="this.onerror=null;this.src='../images/product-image-placeholder.svg'">
            </div>
            <div class="thumbs">
                ${allImages.map((img, i) => `
                    <div class="thumb ${i===0?'active':''}" onclick="switchImage('${img}', this)">
                        <img src="${img}" alt="" onerror="this.onerror=null;this.src='../images/product-image-placeholder.svg'">
                    </div>`).join('')}
            </div>
        </div>
        <div class="product-info">
            <span class="product-category-tag">${p.category} / ${p.brand}</span>
            <h1 class="product-detail-name">${p.name}</h1>
            <div class="product-detail-rating">
                <span class="product-detail-stars">${'★'.repeat(Math.round(p.rating||0))}${'☆'.repeat(5-Math.round(p.rating||0))}</span>
                <span style="font-size:16px;font-weight:700;">${(p.rating||0).toFixed(1)}</span>
                <span class="review-count">${p.numReviews||0} reviews</span>
            </div>
            <div class="product-detail-price">
                <span class="product-current-price">$${p.price}</span>
                ${p.originalPrice > p.price ? `<span class="product-original-price">$${p.originalPrice}</span>` : ''}
                ${discount > 0 ? `<span class="discount-tag">Save ${discount}%</span>` : ''}
            </div>
            <p class="product-detail-desc">${p.description}</p>

            ${p.sizes && p.sizes.length > 0 ? `
            <div class="size-section">
                <div class="size-label">Select Size</div>
                <div class="size-grid">
                    ${p.sizes.map(s => `
                        <button class="size-btn ${s.stock===0?'out-of-stock':''}" onclick="selectSize('${s.size}', this)" ${s.stock===0?'disabled':''}>${s.size}</button>
                    `).join('')}
                </div>
            </div>` : ''}

            <div class="qty-section">
                <div class="qty-controls">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <span class="qty-value" id="qty-display">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
                <span style="font-size:14px;color:var(--text-muted);">
                    ${p.countInStock > 0 ? `<span style="color:#22c55e;">✓</span> ${p.countInStock} in stock` : '<span style="color:var(--accent);">Out of stock</span>'}
                </span>
            </div>

            <div class="product-actions">
                <button class="btn-primary btn-add-full" onclick="addToCartNow()" ${p.countInStock===0?'disabled style="opacity:.5;"':''}>
                    <i class="fas fa-shopping-bag"></i>
                    ${p.countInStock===0?'Out of Stock':'Add to Cart'}
                </button>
                <button class="btn-wishlist" onclick="wishlist()">♡</button>
            </div>

            <div class="product-meta">
                <div class="meta-row"><span class="meta-label">Brand</span><span class="meta-value">${p.brand}</span></div>
                <div class="meta-row"><span class="meta-label">Category</span><span class="meta-value">${p.category}</span></div>
                <div class="meta-row"><span class="meta-label">Tags</span><span class="meta-value">${(p.tags||[]).map(t=>`<span style="background:var(--surface);padding:2px 10px;border-radius:20px;font-size:12px;margin-right:4px;">${t}</span>`).join('')}</span></div>
            </div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs" style="padding: 0 60px;">
        <div class="tab-btns">
            <button class="tab-btn active" onclick="switchTab('description', this)">Description</button>
            <button class="tab-btn" onclick="switchTab('reviews', this)">Reviews (${p.numReviews||0})</button>
            <button class="tab-btn" onclick="switchTab('sizing', this)">Size Guide</button>
        </div>
        <div class="tab-content active" id="tab-description">
            <p style="color:var(--text-muted);font-size:16px;line-height:1.9;max-width:700px;">${p.description}</p>
            <ul style="margin-top:24px;padding-left:20px;color:var(--text-muted);display:flex;flex-direction:column;gap:10px;font-size:15px;">
                <li>Premium craftsmanship with attention to every detail</li>
                <li>Sustainably sourced materials</li>
                <li>Ergonomic design for all-day comfort</li>
                <li>Limited warranty on manufacturing defects</li>
            </ul>
        </div>
        <div class="tab-content" id="tab-reviews">
            <p style="color:var(--text-muted);">${p.numReviews===0?'No reviews yet. Be the first to review this product!':'Reviews coming soon...'}</p>
        </div>
        <div class="tab-content" id="tab-sizing">
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:14px;">
                    <tr style="background:var(--surface);">
                        <th style="padding:14px 20px;text-align:left;border:1px solid var(--border);">UK</th>
                        <th style="padding:14px 20px;text-align:left;border:1px solid var(--border);">EU</th>
                        <th style="padding:14px 20px;text-align:left;border:1px solid var(--border);">US</th>
                        <th style="padding:14px 20px;text-align:left;border:1px solid var(--border);">CM</th>
                    </tr>
                    ${[['6','39','7','24'],['7','40','8','25'],['8','41','9','26'],['9','42','10','27'],['10','43','11','28'],['11','44','12','29']].map(r=>`
                    <tr>
                        ${r.map(v=>`<td style="padding:12px 20px;border:1px solid var(--border);color:var(--text-muted);">${v}</td>`).join('')}
                    </tr>`).join('')}
                </table>
            </div>
        </div>
    </div>`;
}

function switchImage(src, el) {
    document.getElementById('main-img').src = src;
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
}

function selectSize(size, el) {
    selectedSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

function changeQty(delta) {
    qty = Math.max(1, Math.min(qty + delta, currentProduct?.countInStock || 10));
    document.getElementById('qty-display').textContent = qty;
}

function addToCartNow() {
    if (!currentProduct) return;
    if (currentProduct.sizes?.length > 0 && !selectedSize) {
        showToast('Please select a size first!', 'warning');
        return;
    }
    Cart.addItem(currentProduct, qty, selectedSize);
    document.getElementById('cart-btn').click();
}

function wishlist() { showToast('Added to wishlist! ❤️', 'info'); }

function switchTab(id, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    el.classList.add('active');
}

async function loadRelated(category, excludeId) {
    try {
        const res = await fetch(`${API_BASE}/products?category=${category}&pageSize=4`).then(r => r.json());
        const related = res.products.filter(p => p._id !== excludeId).slice(0, 4);
        if (!related.length) return;

        const section = document.createElement('div');
        section.className = 'related-section';
        section.innerHTML = `
            <p class="section-tag">You May Also Like</p>
            <h2 class="section-title">Related Products</h2>
            <div class="related-grid">
                ${related.map(p => `
                <div class="product-card" onclick="window.location='product.html?id=${p._id}'">
                    <div class="product-card-image"><img src="${normalizeImageUrl(p.image)}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='../images/product-image-placeholder.svg'"></div>
                    <div class="product-card-body">
                        <p class="product-card-category">${p.category}</p>
                        <h3 class="product-card-name">${p.name}</h3>
                        <div class="product-card-footer">
                            <span class="price-current">$${p.price}</span>
                            <button class="btn-add-cart" onclick="event.stopPropagation();Cart.addItem(${JSON.stringify(p).replace(/"/g,'&quot;')},1,'')">Add</button>
                        </div>
                    </div>
                </div>`).join('')}
            </div>`;
        document.body.appendChild(section);
    } catch(e) {}
}

function handleUserClick() {
    window.location.href = Auth.isLoggedIn() ? 'orders.html' : 'login.html';
}

loadProduct();
</script>
</body>
</html>
